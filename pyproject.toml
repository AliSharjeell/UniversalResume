[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "samethread"
dynamic = ["version"]
description = "Hop between coding agents, stay on the same thread: one chat history across Claude Code, Codex, Cursor CLI, Antigravity, Grok Build, DeepSeek Harness, Hermes Agent, OpenClaw, Aider, OpenCode, OpenHands, Qwen Code, Kimi Code, and MiniMax Code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GodrezJr2" }]
keywords = ["claude-code", "codex", "cursor", "antigravity", "grok", "deepseek", "hermes", "openclaw", "aider", "opencode", "openhands", "qwen-code", "pi", "kimi", "minimax", "ai-agents", "coding-agents", "session", "resume", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
hop = "samethread.cli:main"
samethread = "samethread.cli:main"
resume = "samethread.cli:main_resume_tui"

[project.urls]
Homepage = "https://github.com/AliSharjeell/UniversalResume"
Issues = "https://github.com/AliSharjeell/UniversalResume/issues"

[tool.setuptools.dynamic]
version = { attr = "samethread.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
